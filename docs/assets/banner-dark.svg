<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- Notion-style dark banner: deep canvas, whisper borders, single blue accent -->
  <rect width="1280" height="400" fill="#191919"/>
  <rect x="0" y="0" width="1280" height="400" fill="#202020" opacity="0.5"/>

  <!-- header -->
  <rect x="64" y="56" width="238" height="28" rx="14" fill="#529cca" opacity="0.16"/>
  <text x="183" y="75" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#529cca">FACT-CROSS-CHECK-SKILL</text>

  <text x="64" y="140" font-size="42" font-weight="700" fill="#ededec">消息去伪存真</text>
  <text x="64" y="172" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#9b9b9b">Verify · Cross-check · Grade · Cite</text>
  <text x="1216" y="140" text-anchor="end" font-size="14" fill="#6f6f6f">四通道查证 · 8 条甄选规则 · 0 编造承诺</text>

  <line x1="64" y1="200" x2="1216" y2="200" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- four source pills -->
  <g font-size="15" font-weight="600">
    <rect x="64" y="224" width="270" height="40" rx="10" fill="#252525" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="90" cy="244" r="5" fill="#529cca"/>
    <text x="106" y="249" fill="#d4d4d4">较真 · 中文主源</text>

    <rect x="348" y="224" width="270" height="40" rx="10" fill="#252525" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="374" cy="244" r="5" fill="#529cca"/>
    <text x="390" y="249" fill="#d4d4d4">WebCite · 国际源</text>

    <rect x="632" y="224" width="270" height="40" rx="10" fill="#252525" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="658" cy="244" r="5" fill="#529cca"/>
    <text x="674" y="249" fill="#d4d4d4">公众号 · 原文回溯</text>

    <rect x="916" y="224" width="270" height="40" rx="10" fill="#252525" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="942" cy="244" r="5" fill="#529cca"/>
    <text x="958" y="249" fill="#d4d4d4">数据终端 · 数字对账</text>
  </g>

  <!-- converge arrows -->
  <g stroke="#6f6f6f" stroke-width="1.5" fill="none">
    <path d="M199 264 L199 282 Q199 292 209 292 L440 292"/>
    <path d="M483 264 L483 292"/>
    <path d="M767 264 L767 292"/>
    <path d="M1051 264 L1051 282 Q1051 292 1041 292 L840 292"/>
  </g>
  <path d="M430 286 L440 292 L430 298 Z" fill="#6f6f6f"/>
  <path d="M830 286 L840 292 L830 298 Z" fill="#6f6f6f"/>

  <!-- merge bar -->
  <rect x="440" y="292" width="400" height="40" rx="10" fill="#529cca"/>
  <text x="640" y="317" text-anchor="middle" font-size="15" font-weight="700" fill="#101418">双源交叉仲裁 · 冲突不调和 · 缺口不编造</text>
  <path d="M634 332 L640 344 L646 332 Z" fill="#6f6f6f"/>

  <!-- six rating chips -->
  <g font-size="13" font-weight="600">
    <rect x="64" y="352" width="92" height="32" rx="16" fill="#1e2d27"/>
    <text x="110" y="373" text-anchor="middle" fill="#7fd0a8">TRUE</text>

    <rect x="168" y="352" width="168" height="32" rx="16" fill="#2d2a1e"/>
    <text x="252" y="373" text-anchor="middle" fill="#d9b95c">MOSTLY TRUE</text>

    <rect x="348" y="352" width="96" height="32" rx="16" fill="#2e241c"/>
    <text x="396" y="373" text-anchor="middle" fill="#d99a5c">MIXED</text>

    <rect x="456" y="352" width="176" height="32" rx="16" fill="#2e1e1e"/>
    <text x="544" y="373" text-anchor="middle" fill="#e07a7a">MOSTLY FALSE</text>

    <rect x="644" y="352" width="92" height="32" rx="16" fill="#331c1c"/>
    <text x="690" y="373" text-anchor="middle" fill="#e06666">FALSE</text>

    <rect x="748" y="352" width="172" height="32" rx="16" fill="#262626"/>
    <text x="834" y="373" text-anchor="middle" fill="#9b9b9b">UNVERIFIABLE</text>
  </g>
</svg>
